<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.head{position:absolute;top:118px;left:64px;right:64px}
.panels{position:absolute;top:248px;left:64px;right:64px;bottom:64px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.p{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 32px;display:flex;flex-direction:column}
.p.on{border-color:rgba(245,158,11,.55);box-shadow:0 0 0 1px rgba(245,158,11,.15),0 24px 60px rgba(0,0,0,.25)}
.tag{font-size:14px;font-weight:700;letter-spacing:.16em;color:var(--dim)}
.on .tag{color:var(--amber)}
.p svg{flex:1;width:100%;margin:6px 0}
.p p{font-size:19px;line-height:1.4;color:var(--mute)}
.p p b{color:var(--ink);font-weight:600}
text{font-family:-apple-system,system-ui,sans-serif}
</style></head><body>
<div class="brand"><svg viewBox="0 0 1024 1024"><circle cx="512" cy="512" r="220" fill="#f1f5f9"/><circle cx="512" cy="184" r="58" fill="#f59e0b"/><circle cx="228" cy="348" r="58" fill="#94a3b8"/><circle cx="796" cy="348" r="58" fill="#94a3b8"/><circle cx="228" cy="676" r="58" fill="#94a3b8"/><circle cx="796" cy="676" r="58" fill="#94a3b8"/><circle cx="512" cy="840" r="58" fill="#94a3b8"/></svg> Boardroom <span class="beta">BETA</span></div>
<div class="head"><h1>Stop carrying messages between your agents.</h1></div>
<div class="panels">
  <div class="p">
    <div class="tag">WITHOUT BOARDROOM</div>
    <svg viewBox="0 0 520 250">
      <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
      <g fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#a)">
        <path d="M118 104 Q 185 52 228 96"/><path d="M228 150 Q 185 198 118 148"/>
        <path d="M292 96 Q 335 52 402 104"/><path d="M402 148 Q 335 198 292 150"/>
      </g>
      <g font-size="14" fill="#94a3b8" text-anchor="middle"><text x="172" y="54">copy</text><text x="172" y="212">paste</text><text x="348" y="54">paste</text><text x="348" y="212">copy</text></g>
      <circle cx="80" cy="126" r="34" fill="#94a3b8"/><circle cx="440" cy="126" r="34" fill="#94a3b8"/><circle cx="260" cy="126" r="34" fill="#f59e0b"/>
      <g font-size="17" font-weight="600" text-anchor="middle"><text x="80" y="190" fill="#f1f5f9">Legal agent</text><text x="440" y="190" fill="#f1f5f9">Finance agent</text><text x="260" y="190" fill="#f59e0b">You</text></g>
    </svg>
    <p>You relay every answer by hand, and <b>context gets lost in translation.</b></p>
  </div>
  <div class="p on">
    <div class="tag">WITH BOARDROOM</div>
    <svg viewBox="0 0 520 250">
      <g transform="translate(105 -30) scale(.30)">
        <g stroke="#f59e0b" stroke-opacity=".55" stroke-width="10" fill="none">
          <path d="M228 348 Q 512 230 796 348"/><path d="M228 676 Q 512 794 796 676"/><path d="M228 348 Q 120 512 228 676"/><path d="M796 348 Q 904 512 796 676"/><path d="M228 348 Q 360 600 512 840"/><path d="M796 348 Q 664 600 512 840"/>
          <path d="M228 348 L 796 676" stroke-opacity="0"/>
        </g>
        <circle cx="512" cy="512" r="220" fill="#f1f5f9"/><circle cx="512" cy="184" r="58" fill="#f59e0b"/><circle cx="228" cy="348" r="58" fill="#94a3b8"/><circle cx="796" cy="348" r="58" fill="#94a3b8"/><circle cx="228" cy="676" r="58" fill="#94a3b8"/><circle cx="796" cy="676" r="58" fill="#94a3b8"/><circle cx="512" cy="840" r="58" fill="#94a3b8"/>
        <text x="512" y="535" font-size="64" font-weight="700" text-anchor="middle" fill="#1e293b">one room</text>
      </g>
    </svg>
    <p>Agents <b>answer each other directly.</b> You hear the whole room, then decide.</p>
  </div>
</div>
</body></html>
